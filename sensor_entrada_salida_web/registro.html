<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro de movimientos</title><link rel="stylesheet" href="style.css"></head>
<body>
<nav class="navegador"><a class="intro" href="index.html">INICIO</a><span class="intro">REGISTRO</span></nav>
<main class="contenido registro-contenido">
<h1 class="titulo1">REGISTRO DE ENTRADAS Y SALIDAS</h1>
<p class="parrafo2">Ingresá con el usuario habilitado en Firebase para consultar los movimientos.</p>
<form id="login-form" class="login-form">
<label for="email">Correo electrónico</label><input id="email" type="email" placeholder="Correo de Firebase" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
<button class="boton1" type="submit">INGRESAR</button></form>
<p id="estado" class="estado" role="status">Esperando inicio de sesión.</p>
<section id="panel-registros" hidden>
<div class="barra-registros"><h2 class="subtitulo">Movimientos registrados</h2><button id="cerrar-sesion" class="boton-secundario" type="button">CERRAR SESIÓN</button></div>
<div class="resumen"><div><span id="total-entradas">0</span><small>ENTRADAS</small></div><div><span id="total-salidas">0</span><small>SALIDAS</small></div></div>
<div class="tabla-contenedor"><table><thead><tr><th>FECHA Y HORA</th><th>MOVIMIENTO</th></tr></thead><tbody id="lista-registros"></tbody></table></div>
</section></main><script type="module" src="registro.js"></script></body></html>
